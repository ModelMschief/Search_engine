<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search Engine</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --bg-color: #f7f9fb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --secondary-text: #6b7280;
            --code-bg: #1f2937;
            --code-text: #f3f4f6;
            --accent-color: #4f46e5;
        }
        .dark {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f3f4f6;
            --secondary-text: #9ca3af;
            --code-bg: #030712;
            --code-text: #a78bfa;
            --accent-color: #6366f1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .text-primary { color: var(--text-color); }
        .text-secondary { color: var(--secondary-text); }
        .bg-card { background-color: var(--card-bg); }
        .border-card { border-color: #374151; }
        .bg-code { background-color: var(--code-bg); }
        .text-code { color: var(--code-text); }

        /* Custom scrollbar for aesthetics */
        .suggestion-list::-webkit-scrollbar { width: 8px; }
        .suggestion-list::-webkit-scrollbar-thumb { background-color: var(--secondary-text); border-radius: 10px; }
        .suggestion-list::-webkit-scrollbar-track { background-color: var(--card-bg); }

        /* Custom glow effect on search input focus */
        #searchInput:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.5);
        }

        /* Price styling */
        .price-tag {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10 flex justify-between items-start">
            <div class="flex-grow text-center">
                <h1 class="text-4xl font-extrabold text-primary transition duration-300">Product Search Engine</h1>
                <p class="text-secondary mt-2">Find products with intelligent search powered by machine learning.</p>
            </div>
            <!-- Dark Mode Toggle -->
            <button id="themeToggle" class="p-3 rounded-full bg-card shadow-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition duration-300" aria-label="Toggle theme">
                <svg id="sunIcon" class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: none;"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.698 4.256a.75.75 0 0 1 .536.22l1.59 1.59a.75.75 0 0 1-1.06 1.06l-1.59-1.59a.75.75 0 0 1 .22-.536ZM3 12a.75.75 0 0 1 .75-.75h2.25a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12ZM16.5 7.698a.75.75 0 0 1 1.06-.22l1.59 1.59a.75.75 0 1 1-1.06 1.06l-1.59-1.59a.75.75 0 0 1-.22-1.06ZM12 18a.75.75 0 0 1-.75-.75v-2.25a.75.75 0 0 1 1.5 0v2.25a.75.75 0 0 1-.75.75ZM7.698 16.5a.75.75 0 0 1-1.06.22l-1.59-1.59a.75.75 0 1 1 1.06-1.06l1.59 1.59a.75.75 0 0 1-.22 1.06ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5h2.25a.75.75 0 0 1 .75.75ZM16.5 16.5a.75.75 0 0 1-.22 1.06l-1.59 1.59a.75.75 0 1 1-1.06-1.06l1.59-1.59a.75.75 0 0 1 1.06.22ZM12 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"></path></svg>
                <svg id="moonIcon" class="w-5 h-5 text-indigo-400" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display: block;"><path fill-rule="evenodd" d="M9.52 2.72a.75.75 0 0 1 .44.92c-.524 1.456-.632 2.9-.29 4.195a9.38 9.38 0 0 0 5.483 5.483c1.295.342 2.739.234 4.195-.29a.75.75 0 0 1 .92.441A9.76 9.76 0 0 1 21.75 12C21.75 17.385 17.385 21.75 12 21.75S2.25 17.385 2.25 12c0-2.404.838-4.63 2.25-6.326a.75.75 0 0 1 .92-.441 4.793 4.793 0 0 0 6.619.664Z" clip-rule="evenodd"></path></svg>
            </button>
        </header>

        <!-- Search Bar and Suggestions Container -->
        <div class="relative mb-8">
            <input type="text" id="searchInput"
                placeholder="Search products (e.g., 'laptop', 'coffee', 'electronics')"
                class="w-full p-4 pl-12 text-lg border-2 border-indigo-500/20 focus:border-indigo-500 bg-card rounded-xl shadow-2xl transition duration-300 focus:outline-none"
                autocomplete="off">

            <!-- Search Icon -->
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>

            <!-- Dynamic Suggestion Dropdown -->
            <ul id="suggestionList" class="absolute z-10 w-full bg-card border border-indigo-500/20 rounded-xl shadow-2xl mt-2 max-h-80 overflow-y-auto suggestion-list hidden">
                <!-- Suggestions will be inserted here -->
            </ul>
        </div>

        <!-- Selected Product Display (Single View) -->
        <div id="productDisplay" class="bg-card p-6 sm:p-8 rounded-xl shadow-xl border border-indigo-500/10 hidden transition-all duration-300 transform">
            <h2 id="productTitle" class="text-3xl font-bold text-primary mb-4"></h2>
            <div class="flex items-center space-x-4 mb-4 text-sm text-secondary">
                <span id="productCategory" class="px-3 py-1 bg-indigo-50 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 font-medium rounded-full flex items-center gap-1">
                    <!-- Icon placeholder -->
                </span>
                <span id="productPrice" class="price-tag px-3 py-1 font-medium rounded-full"></span>
            </div>
            <p id="productDescription" class="text-secondary leading-relaxed mb-6 border-b pb-4 border-indigo-500/10"></p>

            <!-- Product Details -->
            <div class="mt-4">
                <div class="flex justify-between items-center bg-code text-code rounded-t-lg p-3">
                    <span class="font-mono text-sm opacity-80">Product Details</span>
                    <button id="shareButton" class="text-indigo-400 hover:text-indigo-200 transition duration-150 text-sm flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                        Share
                    </button>
                </div>
                <div class="bg-gray-900 text-code p-4 rounded-b-lg overflow-x-auto text-sm">
                    <div id="productDetails" class="space-y-2"></div>
                </div>
            </div>
            <button onclick="clearProductDisplay()" class="mt-6 text-indigo-600 dark:text-indigo-400 hover:underline text-sm font-medium">
                ← Back to Products
            </button>
        </div>

        <!-- Default Content Area (for listing multiple products) -->
        <div id="defaultContentArea" class="mt-8">
            <h2 class="text-2xl font-bold text-primary mb-6">Featured Products</h2>

            <!-- Interactive Filters -->
            <div id="filterContainer" class="flex flex-wrap gap-2 mb-8">
                <button data-filter="All" class="filter-btn active-filter">All Categories</button>
                <button data-filter="Electronics" class="filter-btn">Electronics</button>
                <button data-filter="Clothing" class="filter-btn">Clothing</button>
                <button data-filter="Home & Kitchen" class="filter-btn">Home & Kitchen</button>
                <button data-filter="Books" class="filter-btn">Books</button>
                <button data-filter="Sports" class="filter-btn">Sports</button>
            </div>

            <div id="defaultProductsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Default/Featured Products will be inserted here -->
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 right-5 bg-green-600 text-white p-3 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none">
            Product URL copied to clipboard!
        </div>
    </div>

    <script>
        // --- 1. API ENDPOINT ---
        const BASE_URL = "https://otp-buxb.onrender.com/api";

        // --- 2. DOM SETUP ---
        const searchInput = document.getElementById('searchInput');
        const suggestionList = document.getElementById('suggestionList');
        const productDisplay = document.getElementById('productDisplay');
        const defaultContentArea = document.getElementById('defaultContentArea');
        const defaultProductsContainer = document.getElementById('defaultProductsContainer');
        const shareButton = document.getElementById('shareButton');
        const toast = document.getElementById('toast');
        const themeToggle = document.getElementById('themeToggle');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // Category icons
        const categoryIcons = {
            'Electronics': '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>',
            'Clothing': '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>',
            'Home & Kitchen': '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>',
            'Books': '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>',
            'Sports': '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>',
        };

        // --- 3. UTILITY AND INTERACTIVITY FUNCTIONS ---

        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // Renders a single product element for the default view
        function createDefaultProductElement(product) {
            const div = document.createElement('div');
            const icon = categoryIcons[product.category] || '';

            div.className = 'bg-card p-5 rounded-xl shadow-lg border border-indigo-500/10 hover:shadow-2xl transition duration-300 cursor-pointer transform hover:-translate-y-1';
            div.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-medium text-indigo-600 dark:text-indigo-400 flex items-center gap-1">${icon} ${product.category}</span>
                    <span class="price-tag text-xs font-medium px-2 py-0.5 rounded-full">$${product.price.toFixed(2)}</span>
                </div>
                <h3 class="text-lg font-bold text-primary truncate mb-2">${product.name}</h3>
                <p class="text-sm text-secondary line-clamp-2">${product.description}</p>
            `;
            div.addEventListener('click', () => {
                displayProduct(product);
                searchInput.value = ''; // Clear search input when selecting from the grid
                suggestionList.classList.add('hidden');
            });
            return div;
        }

        // Renders products based on a filter
        async function renderFilteredProducts(filterCategory = 'All') {
            defaultProductsContainer.innerHTML = '<div class="col-span-full text-center py-8 text-secondary">Loading products...</div>';
            
            try {
                const response = await fetch(`${BASE_URL}/products`);
                const data = await response.json();
                let filteredProducts = data.products;

                if (filterCategory !== 'All') {
                    filteredProducts = data.products.filter(product => product.category === filterCategory);
                }

                defaultProductsContainer.innerHTML = '';
                
                if (filteredProducts.length === 0) {
                    defaultProductsContainer.innerHTML = '<div class="col-span-full text-center py-8 text-secondary">No products found in this category.</div>';
                    return;
                }

                filteredProducts.forEach(product => {
                    defaultProductsContainer.appendChild(createDefaultProductElement(product));
                });

                // Ensure the correct content area is visible
                productDisplay.classList.add('hidden');
                defaultContentArea.classList.remove('hidden');
            } catch (error) {
                console.error('Error loading products:', error);
                defaultProductsContainer.innerHTML = '<div class="col-span-full text-center py-8 text-secondary">Error loading products. Please try again.</div>';
            }
        }

        // Displays a single product's details
        function displayProduct(product) {
            const icon = categoryIcons[product.category] || '';

            document.getElementById('productTitle').textContent = product.name;
            document.getElementById('productCategory').innerHTML = `${icon} ${product.category}`;
            document.getElementById('productPrice').textContent = `$${product.price.toFixed(2)}`;
            document.getElementById('productDescription').textContent = product.description;
            
            // Create product details
            const detailsContainer = document.getElementById('productDetails');
            detailsContainer.innerHTML = `
                <div class="flex justify-between">
                    <span class="text-gray-400">Price:</span>
                    <span class="font-bold">$${product.price.toFixed(2)}</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Category:</span>
                    <span>${product.category}</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">In Stock:</span>
                    <span class="text-green-400">${product.inStock !== false ? 'Yes' : 'No'}</span>
                </div>
            `;

            // Animate the product display
            productDisplay.style.opacity = '0';
            productDisplay.style.transform = 'translateY(10px)';
            productDisplay.classList.remove('hidden');

            setTimeout(() => {
                productDisplay.style.opacity = '1';
                productDisplay.style.transform = 'translateY(0)';
            }, 10); // Slight delay for transition to kick in

            defaultContentArea.classList.add('hidden');
            shareButton.dataset.productId = product.id; // Store product ID for sharing
        }

        function clearProductDisplay() {
            productDisplay.classList.add('hidden');
            searchInput.value = '';
            renderFilteredProducts('All');
        }

        // Render search suggestions
        function renderSuggestions(results) {
            suggestionList.innerHTML = '';
            
            if (results.length === 0) {
                suggestionList.classList.add('hidden');
                return;
            }
            
            results.slice(0, 5).forEach(product => {
                const li = document.createElement('li');
                li.className = 'p-3 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 cursor-pointer border-b border-indigo-500/10 last:border-b-0';
                li.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-medium">${product.name}</span>
                        <span class="text-sm price-tag px-2 py-1 rounded-full">$${product.price.toFixed(2)}</span>
                    </div>
                    <div class="text-xs text-secondary mt-1">${product.category}</div>
                `;
                li.addEventListener('click', () => {
                    displayProduct(product);
                    suggestionList.classList.add('hidden');
                    searchInput.value = '';
                });
                suggestionList.appendChild(li);
            });
            
            suggestionList.classList.remove('hidden');
        }

        // --- 4. EVENT HANDLERS ---

        const handleSearch = debounce(async () => {
            const query = searchInput.value.trim();

            if (query.length < 2) {
                suggestionList.classList.add('hidden');
                // If search is cleared, show the default grid again
                defaultContentArea.classList.remove('hidden');
                productDisplay.classList.add('hidden'); // Ensure single view is hidden
                return;
            }

            // Hide default grid and single product view when searching
            defaultContentArea.classList.add('hidden');
            productDisplay.classList.add('hidden');

            try {
                const response = await fetch(`${BASE_URL}/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                renderSuggestions(data.results);
            } catch (error) {
                console.error('Search error:', error);
                suggestionList.innerHTML = '<li class="p-3 text-center text-secondary">Error performing search</li>';
                suggestionList.classList.remove('hidden');
            }

        }, 300);

        searchInput.addEventListener('input', handleSearch);

        // Filter button click handler
        filterButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                filterButtons.forEach(btn => btn.classList.remove('active-filter'));
                e.target.classList.add('active-filter');
                searchInput.value = ''; // Clear search on filter click
                suggestionList.classList.add('hidden');
                renderFilteredProducts(e.target.dataset.filter);
            });

            // Styling for filter buttons
            button.classList.add('px-4', 'py-2', 'rounded-full', 'font-medium', 'text-sm', 'transition', 'duration-200', 'bg-gray-100', 'dark:bg-gray-700', 'hover:bg-indigo-100', 'dark:hover:bg-indigo-800', 'text-secondary', 'cursor-pointer');
            button.style.setProperty('--tw-text-opacity', '1');
        });
        // Active filter styling (must be added after initial class list)
        document.querySelector('.active-filter').classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'dark:bg-indigo-600', 'text-white', '!text-white');

        // Dark Mode Toggle Logic
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('sunIcon').style.display = isDark ? 'block' : 'none';
            document.getElementById('moonIcon').style.display = isDark ? 'none' : 'block';
        });

        // Initialize theme based on user preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        document.getElementById('sunIcon').style.display = document.documentElement.classList.contains('dark') ? 'block' : 'none';
        document.getElementById('moonIcon').style.display = document.documentElement.classList.contains('dark') ? 'none' : 'block';

        // Share Product Logic
        shareButton.addEventListener('click', () => {
            const productId = shareButton.dataset.productId;
            if (productId) {
                try {
                    const productUrl = `${window.location.origin}?product=${productId}`;
                    navigator.clipboard.writeText(productUrl).then(() => {
                        toast.classList.remove('opacity-0');
                        toast.classList.add('opacity-100');
                        setTimeout(() => {
                            toast.classList.remove('opacity-100');
                            toast.classList.add('opacity-0');
                        }, 1500);
                    });
                } catch (err) {
                    console.error('Failed to copy URL: ', err);
                }
            }
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionList.contains(e.target)) {
                suggestionList.classList.add('hidden');
            }
        });

        // --- 5. INITIALIZATION ---
        window.onload = function() {
            renderFilteredProducts('All');
        }
    </script>
</body>
</html>
